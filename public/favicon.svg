<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 120 570 680" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Drop Shadow -->
    <filter id="markDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="markSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Gradients for Z Bevels -->
    <linearGradient id="markMetalLightTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#B6BFCB" />
      <stop offset="50%" stopColor="#8793A3" />
      <stop offset="100%" stopColor="#586374" />
    </linearGradient>

    <linearGradient id="markMetalDarkBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#434B59" />
      <stop offset="60%" stopColor="#2B323D" />
      <stop offset="100%" stopColor="#1D222A" />
    </linearGradient>

    <linearGradient id="markMetalLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#9AA5B5" />
      <stop offset="50%" stopColor="#6C7787" />
      <stop offset="100%" stopColor="#4A5361" />
    </linearGradient>

    <linearGradient id="markMetalRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#434B59" />
      <stop offset="100%" stopColor="#252B35" />
    </linearGradient>

    <linearGradient id="markMetalDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8A96A7" />
      <stop offset="35%" stopColor="#636E7E" />
      <stop offset="65%" stopColor="#82665B" />
      <stop offset="100%" stopColor="#454D5A" />
    </linearGradient>

    <!-- Arrow Vibrant Coral Gradient -->
    <linearGradient id="markArrowGrad" x1="330" y1="620" x2="720" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF5533" />
      <stop offset="40%" stopColor="#FF7A59" />
      <stop offset="75%" stopColor="#FF9371" />
      <stop offset="100%" stopColor="#FFB191" />
    </linearGradient>

    <!-- Copper Circuit Trace Gradients -->
    <linearGradient id="markTrace1Grad" x1="280" y1="685" x2="365" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6C7788" />
      <stop offset="100%" stopColor="#555E6D" />
    </linearGradient>

    <linearGradient id="markTrace2Grad" x1="385" y1="685" x2="470" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#A46E60" />
      <stop offset="100%" stopColor="#7A564D" />
    </linearGradient>

    <linearGradient id="markTrace3Grad" x1="490" y1="685" x2="575" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF7A59" />
      <stop offset="100%" stopColor="#B8553C" />
    </linearGradient>
  </defs>

  <!-- Central Ambient Coral Glow -->
  <circle cx="480" cy="420" r="220" fill="#FF7A59" opacity="0.12" filter="url(#markSoftGlow)" />

  <!-- MAIN EMBLEM GROUP WITH REALISTIC 3D DROP SHADOW -->
  <g filter="url(#markDropShadow)">

    <!-- 3 CIRCUIT BOARD TRACES & CONTACT PADS -->
    <!-- Trace 1 -->
    <g>
      <line x1="280" y1="675" x2="365" y2="760" stroke="#12151B" stroke-width="24" stroke-linecap="round" />
      <line x1="280" y1="675" x2="365" y2="760" stroke="url(#markTrace1Grad)" stroke-width="18" stroke-linecap="round" />
      <line x1="280" y1="675" x2="365" y2="760" stroke="#8D9BB0" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <circle cx="365" cy="760" r="32" fill="#151820" stroke="url(#markTrace1Grad)" stroke-width="14" />
      <circle cx="365" cy="760" r="32" fill="none" stroke="#8D9BB0" stroke-width="3" opacity="0.5" />
      <circle cx="365" cy="760" r="14" fill="#13151A" />
    </g>

    <!-- Trace 2 -->
    <g>
      <line x1="385" y1="675" x2="470" y2="760" stroke="#12151B" stroke-width="24" stroke-linecap="round" />
      <line x1="385" y1="675" x2="470" y2="760" stroke="url(#markTrace2Grad)" stroke-width="18" stroke-linecap="round" />
      <line x1="385" y1="675" x2="470" y2="760" stroke="#D39788" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <circle cx="470" cy="760" r="32" fill="#151820" stroke="url(#markTrace2Grad)" stroke-width="14" />
      <circle cx="470" cy="760" r="32" fill="none" stroke="#D39788" stroke-width="3" opacity="0.5" />
      <circle cx="470" cy="760" r="14" fill="#13151A" />
    </g>

    <!-- Trace 3 -->
    <g>
      <line x1="490" y1="675" x2="575" y2="760" stroke="#12151B" stroke-width="24" stroke-linecap="round" />
      <line x1="490" y1="675" x2="575" y2="760" stroke="url(#markTrace3Grad)" stroke-width="18" stroke-linecap="round" />
      <line x1="490" y1="675" x2="575" y2="760" stroke="#FFA07A" stroke-width="4" stroke-linecap="round" opacity="0.7" />
      <circle cx="575" cy="760" r="32" fill="#151820" stroke="url(#markTrace3Grad)" stroke-width="14" />
      <circle cx="575" cy="760" r="32" fill="none" stroke="#FFA07A" stroke-width="3" opacity="0.6" />
      <circle cx="575" cy="760" r="14" fill="#13151A" />
    </g>

    <!-- Base Underlay of the 'Z' -->
    <path
      d="
        M 198 150 
        H 558 
        V 204 
        H 248 
        V 294 
        H 558 
        L 190 718 
        H 708 
        V 632 
        H 526 
        V 576 
        H 708 
        V 718 
        H 190 
        V 632 
        L 508 248 
        H 198 
        Z
      "
      fill="#1A1E26"
    />

    <!-- TOP ARM -->
    <polygon points="198,150 558,150 538,174 218,174" fill="url(#markMetalLightTop)" />
    <polygon points="198,150 218,174 218,274 198,294" fill="url(#markMetalLeft)" />
    <polygon points="558,150 558,204 538,188 538,174" fill="url(#markMetalRight)" />
    <polygon points="218,174 538,174 538,188 218,188" fill="url(#markMetalDarkBot)" />
    
    <polygon points="248,204 508,204 492,218 264,218" fill="url(#markMetalLightTop)" />
    <polygon points="248,248 508,248 492,234 264,234" fill="url(#markMetalDarkBot)" />
    <polygon points="248,204 264,218 264,234 248,248" fill="url(#markMetalLeft)" />
    <polygon points="198,294 558,294 538,274 218,274" fill="url(#markMetalDarkBot)" />

    <!-- MAIN METALLIC DIAGONAL STRUT -->
    <polygon 
      points="528,248 376,432 190,632 238,632 422,432 558,248" 
      fill="url(#markMetalDiag)" 
    />
    <line x1="538" y1="248" x2="208" y2="632" stroke="#BAC5D4" stroke-width="3" opacity="0.6" />
    <line x1="520" y1="248" x2="190" y2="632" stroke="#181B22" stroke-width="3" opacity="0.8" />

    <!-- BOTTOM ARM -->
    <polygon points="190,718 708,718 688,698 210,698" fill="url(#markMetalDarkBot)" />
    <polygon points="190,632 190,718 210,698 210,652" fill="url(#markMetalLeft)" />
    <polygon points="708,632 708,718 688,698 688,652" fill="url(#markMetalRight)" />
    <polygon points="210,698 688,698 688,674 210,674" fill="url(#markMetalLightTop)" />

    <polygon points="526,632 708,632 688,648 542,648" fill="url(#markMetalLightTop)" />
    <polygon points="526,672 708,672 688,656 542,656" fill="url(#markMetalDarkBot)" />
    <polygon points="526,632 542,648 542,656 526,672" fill="url(#markMetalLeft)" />

    <!-- GLOWING CORAL ARROW -->
    <g>
      <path
        d="M 335 624 L 626 238 L 658 260 L 372 648 Z"
        fill="#FF7A59"
        opacity="0.25"
        filter="url(#markSoftGlow)"
      />

      <polygon
        points="335,622 628,236 662,260 372,648"
        fill="url(#markArrowGrad)"
      />

      <line x1="335" y1="622" x2="628" y2="236" stroke="#FFEAE2" stroke-width="4" stroke-linecap="round" opacity="0.85" />
      <line x1="372" y1="648" x2="662" y2="260" stroke="#C83B19" stroke-width="4" stroke-linecap="round" opacity="0.9" />
      <line x1="353" y1="635" x2="645" y2="248" stroke="#FFA07A" stroke-width="2" opacity="0.6" />

      <!-- Arrowhead -->
      <g>
        <polygon points="582,194 722,138 704,288 632,240" fill="#B32D0D" opacity="0.4" />
        <polygon
          points="586,192 720,138 702,286 632,238"
          fill="url(#markArrowGrad)"
        />
        <polygon
          points="586,192 720,138 650,188"
          fill="#FFFFFF"
          opacity="0.32"
        />
        <polygon
          points="702,286 720,138 676,242"
          fill="#8A1E07"
          opacity="0.38"
        />
        <line x1="632" y1="238" x2="720" y2="138" stroke="#FFF0EA" stroke-width="4" stroke-linecap="round" />
        <polyline
          points="586,192 720,138 702,286"
          stroke="#FFA07A"
          stroke-width="2.5"
          fill="none"
        />
      </g>
    </g>

    <!-- Warm Bounce Light -->
    <polygon points="528,248 558,248 422,432 396,432" fill="#FF7A59" opacity="0.28" />
    <polygon points="376,432 402,432 248,600 226,600" fill="#FFA07A" opacity="0.22" />

  </g>
</svg>
